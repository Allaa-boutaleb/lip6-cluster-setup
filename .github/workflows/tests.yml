name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the tools with its /bin/bash 3.2; Windows with Git Bash
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Offline test suite (fake ssh and schedulers, sandboxed HOME)
        run: |
          status=0
          for t in tests/test_*.sh; do
            echo "== $t"
            /bin/bash "$t" || { echo "FAIL $t"; status=1; }
          done
          exit $status

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S error lip6-cluster-setup conv-manager hpc-notebook
